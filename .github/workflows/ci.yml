name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile C++23 wrapper & verify CLI
        run: |
          clang++ -std=c++23 -O2 -Wall -Wextra -Werror cli/wrapper.cpp -o cli/cf
          chmod +x cli/cf cli/main.py
          ./cli/cf --version

      - name: Run Python CLI unit tests
        run: python3 -m unittest discover -v tests

      - name: Validate & test Browser Extension
        run: |
          python3 -c 'import json; m = json.load(open("extension/manifest.json")); assert m.get("manifest_version") == 3'
          node --check extension/main.js
          node --test tests/test_extension.mjs
