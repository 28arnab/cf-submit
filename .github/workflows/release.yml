name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Package CLI, extension, and setup guide
        run: |
          PACKAGE_NAME="cf-submit-${GITHUB_REF_NAME}-linux-x86_64"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          node -e 'const fs = require("node:fs"); const cli = fs.readFileSync("cli/main.js", "utf8").match(/const VERSION = "([^"]+)";/)?.[1]; const extension = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8")).version; if (cli !== process.argv[1] || extension !== process.argv[1]) { throw new Error(`Release tag ${process.argv[1]} does not match CLI ${cli} and extension ${extension}`); }' "$RELEASE_VERSION"
          mkdir -p "dist/$PACKAGE_NAME"
          cp -R cli extension README.md LICENSE "dist/$PACKAGE_NAME/"
          rm -f "dist/$PACKAGE_NAME/extension/bridge-config.js"
          (cd dist && zip -qr "../$PACKAGE_NAME.zip" "$PACKAGE_NAME")
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Package compatibility

            - **Current release package:** Linux x86_64, Node.js, and `clang++` or `g++` to build the native launcher.
            - **Portable components:** The Node.js CLI and Chromium browser extension use JavaScript, but the native launcher and installer in this release are Linux-specific.
          files: ${{ env.PACKAGE_NAME }}.zip
